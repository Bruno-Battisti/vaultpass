spring:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false

security:
  jwt:
    # Test-only fixture, not a real secret. Never used outside the test profile.
    secret: JX46218BndVjHZw2F+2ZHAOpK1jlu9HCM9v99m5vQoU=
  encryption:
    # Test-only fixture, not a real secret. Never used outside the test profile.
    master-key: du7RQvgVkC26cuc13qyVzIL/DNzVoLiDv7fferEOp80=
  # Disabled in tests: IT test classes share one Spring context (and thus one
  # rate-limit bucket cache) across many @Test methods that all hit /auth/login
  # from the same synthetic IP, which would make unrelated tests start
  # failing with 429 once the shared per-IP bucket runs dry. The limiter's
  # own logic is covered directly by RateLimitingFilterTest instead.
  rate-limit:
    enabled: false

logging:
  level:
    com.vaultpass: INFO
